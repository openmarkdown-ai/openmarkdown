[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
vault-types = { path = "crates/vault-types" }
vault-ofm = { path = "crates/vault-ofm" }
vault-index = { path = "crates/vault-index" }
vault-bases = { path = "crates/vault-bases" }
vault-clip = { path = "crates/vault-clip" }
vault-publish = { path = "crates/vault-publish" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tl = "0.7"
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
